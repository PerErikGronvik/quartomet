project:
  type: default

bibliography: references.bib
csl: norsk-apa-manual.csl
lang: en-GB

format:
  pdf:
    documentclass: scrreprt
    classoption: 12pt
    pdf-engine: lualatex
    pdf-standard: ua-2
    include-in-header: latex/preamble.tex
    number-sections: true
    toc: true
    lof: true
    lot: true
    colorlinks: true
    link-citations: true
    linkcolor: blue
    citecolor: blue
    urlcolor: blue
